name: Perslijst maken

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: Maximum aantal pagina's per medium
        type: choice
        default: '12'
        options:
          - '8'
          - '12'
          - '20'
  push:
    branches:
      - main
    paths:
      - media_catalog.csv
      - scrape_press.py
      - contact_utils.py
      - summarize_results.py
      - verify_contacts.py
      - requirements.txt

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Controleer de scraper
        run: python -m unittest discover -s tests -v
      - name: Verzamel contacten en maak rapport
        env:
          PRESS_MAX_PAGES: ${{ inputs.max_pages || '12' }}
        run: |
          python scrape_press.py media_catalog.csv perslijst.csv
          python verify_contacts.py perslijst.csv
          python summarize_results.py perslijst.csv perslijst_rapport.csv perslijst_samenvatting.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perslijst-csv
          path: |
            perslijst.csv
            perslijst_rapport.csv
            perslijst_samenvatting.txt
          retention-days: 14
          if-no-files-found: warn
